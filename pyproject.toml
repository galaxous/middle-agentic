[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "middle-agentic"
version = "0.6.0"
description = "Cross-platform middle-agent node: bootstrap, LLM gateway with fallback chain, graph memory, hooks, CLI, SDK and MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.55.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
magent = "middle_agentic.cli:main"

[tool.setuptools.packages.find]
include = ["middle_agentic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::UserWarning:pydantic.*"]
